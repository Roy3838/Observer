     PantryRepository.kt in the editor. Holds on :app:compileDebugKotlin (spinner, "Gradle Build
     Running" in the status bar) while Kotlin deprecation warnings trickle in: warnings aren't a
     failure. When the suite starts it, it ends by ?outcome=: success, Kotlin finishes at 55% of the
     run, the dex/package tasks follow, then BUILD SUCCESSFUL and "Build Pantry: finished"; fail,
     compileDebugKotlin fails with two errors in PantryRepository.kt (red squiggle in the editor),

<script>
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const ROOT = '/Users/roy/AndroidStudioProjects/Pantry';
  const SRC = 'app/src/main/java/com/pantry/app';

  // ---- Editor: PantryRepository.kt, lines 52–68 (scrolled to the code the build trips on), with a small Kotlin highlighter.
  const FIRST = 52;
  const CODE = `    /** Items expiring within [days], for the "Use soon" shelf. */
    suspend fun expiringWithin(days: Int): List<PantryItem> {
        val cutoff = clock.millis() + days * DAY_MS
        return dao.all()
            .filter { it.bestBefore != null }
            .filter { it.expiresAt <= cutoff }
            .map { it.toModel() }
    }

    private fun ItemEntity.toModel() = PantryItem(
        id = id,
        name = name,
        quantity = quantity,
        bestBefore = bestBefore,
        daysLeft = daysUntil(bestBefore),
    )

    private fun daysUntil(epochMs: Long): Int =`;
  const KW = /\b(private|val|var|fun|suspend|return|if|else|null|class|object|it)\b/g;
  const hl = line => {
    if (/^\s*\/\*\*/.test(line)) return `<span class="com">${esc(line)}</span>`;
    let h = esc(line)
      .replace(/("[^"]*")/g, '\u0001$1\u0002')
      .replace(KW, m => m === 'it' ? m : `<span class="kw">${m}</span>`)
      .replace(/\bfun<\/span> (\w+\.)?(\w+)/g, (m, recv = '', name) => `fun</span> ${recv}<span class="fn">${name}</span>`)
      .replace(/\.(bestBefore|expiresAt|millis)\b(?!\()/g, '.<span class="prop">$1</span>')
      .replace(/\b(DAY_MS)\b/g, '<span class="prop">$1</span>')
      .replace(/\u0001([^\u0002]*)\u0002/g, '<span class="str">$1</span>');
    return h;
  };
  const lines = CODE.split('\n');
  $('gut').innerHTML = lines.map((_, k) => FIRST + k).join('<br>');
  const renderCode = failed => {
    $('code').innerHTML = lines.map((l, k) => {
      let h = hl(l);
      if (failed && FIRST + k === 57) h = h.replace('.<span class="prop">expiresAt</span>', '.<span class="prop err">expiresAt</span>');
      if (failed && FIRST + k === 66) h = h.replace('daysUntil(bestBefore)', 'daysUntil(<span class="err">bestBefore</span>)');
      return h;
    }).join('\n');
    $('inspect').innerHTML = failed
      ? `<img class="i" src="androidstudio_assets/status_error.svg">2 <img class="i" src="androidstudio_assets/status_warning.svg">1`
      : `<img class="i" src="androidstudio_assets/status_warning.svg">1`;
  };
  renderCode(false);

  // ---- Build tree + console
  const tree = [], con = [];
  const loadedAt = Date.now(), SINCE = 161000;  // the build had been going 2m41s when the page opened
  const elapsed = () => Date.now() - loadedAt + SINCE;
  const dur = ms => { const s = Math.round(ms / 1000), m = Math.floor(s / 60); return m ? `${m} min, ${s % 60} sec` : `${s} sec`; };
  const at = () => { const d = new Date(); return `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}, ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`; };

  const ICON = {
    ok: '<img class="i" src="androidstudio_assets/general_greenCheckmark.svg">',
    run: '<div class="spin"></div>', skip: '<div class="skip"></div>',
    err: '<img class="i" src="androidstudio_assets/status_error.svg">', warn: '<img class="i" src="androidstudio_assets/status_warning.svg">',
    kt: '<svg class="kt" viewBox="0 0 16 16"><path d="M2 2h12L8 8l6 6H2z" fill="none" stroke="#9e7bf0" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  };
  const renderTree = () => {
    $('tree').innerHTML = tree.map(n => `<div class="node${n.cls ? ' ' + n.cls : ''}" style="padding-left:${8 + n.lvl * 20}px">
      <span class="chev">${n.open === undefined ? '' : n.open ? '⌄' : '›'}</span>${ICON[n.icon] || ''}<span class="t">${n.html}</span><span class="d">${n.d || ''}</span></div>`).slice(-60).join('');
    $('con').innerHTML = `<div>${con.slice(-80).join('\n')}</div>`;
  };
  const task = (name, state, d) => {
    const icon = state === 'NO-SOURCE' || state === 'SKIPPED' ? 'skip' : 'ok';
    tree.push({ lvl: 1, icon, html: `${name}${state && icon === 'ok' ? ` <span class="g">${state}</span>` : ''}`, d });
    con.push(`&gt; Task ${name}${state ? ' ' + state : ''}`);
  };

  const rootNode = { lvl: 0, open: true, icon: 'run', cls: 'root', html: '<b>Build Pantry:</b> <span class="g">running…</span>' };
  tree.push(rootNode, { lvl: 1, icon: undefined, html: '<span style="margin-left:-20px">⤓</span> Download info' });
  con.push(`Executing tasks: [:app:assembleDebug] in project ${ROOT}`, '', 'Starting Gradle Daemon...', 'Gradle Daemon started in 1 s 412 ms', '');
  [[':app:checkKotlinGradlePluginConfigurationErrors', 'SKIPPED'], [':app:preBuild', 'UP-TO-DATE'], [':app:preDebugBuild', 'UP-TO-DATE'],
   [':app:mergeDebugNativeDebugMetadata', 'NO-SOURCE'], [':app:generateDebugBuildConfig', 'UP-TO-DATE', '1 ms'], [':app:checkDebugAarMetadata', '', '41 ms'],
   [':app:generateDebugResValues', 'UP-TO-DATE', '1 ms'], [':app:mapDebugSourceSetPaths', '', '6 ms'], [':app:generateDebugResources', 'UP-TO-DATE', '1 ms'],
   [':app:mergeDebugResources', '', '1 sec, 211 ms'], [':app:packageDebugResources', '', '212 ms'], [':app:parseDebugLocalResources', '', '96 ms'],
   [':app:createDebugCompatibleScreenManifests', 'UP-TO-DATE', '1 ms'], [':app:extractDeepLinksDebug', 'UP-TO-DATE', '2 ms'],
   [':app:processDebugMainManifest', '', '141 ms'], [':app:processDebugManifest', '', '22 ms'], [':app:processDebugManifestForPackage', '', '18 ms'],
   [':app:processDebugResources', '', '1 sec, 640 ms'], [':app:kspDebugKotlin', '', '38 sec, 412 ms']].forEach(([n, s, d]) => task(n, s, d));
  const kotlin = { lvl: 1, open: true, icon: 'run', html: ':app:compileDebugKotlin' };
  tree.push(kotlin);
  con.push('&gt; Task :app:compileDebugKotlin');

  // Kotlin warnings, under the task in the tree and as w: lines in the console.
  const WARN = [
    ['ui/scan/ScanScreen.kt', 'ui/scan', 88, 31, "'val LocalLifecycleOwner: ProvidableCompositionLocal&lt;LifecycleOwner&gt;' is deprecated. Moved to lifecycle-runtime-compose library in androidx.lifecycle.compose package."],
    ['ui/home/HomeScreen.kt', 'ui/home', 142, 17, "'fun Divider(modifier: Modifier = ..., thickness: Dp = ..., color: Color = ...): Unit' is deprecated. Renamed to HorizontalDivider."],
    ['data/sync/SyncWorker.kt', 'data/sync', 54, 9, "Parameter 'attempt' is never used."],
  ];
  let warned = 0;
  const warn = () => {
    if (kotlin.icon !== 'run' || warned >= WARN.length) return;  // only while Kotlin is compiling
    const [file, dir, l, c, msg] = WARN[warned++];
    const name = file.split('/').pop();
    tree.push({ lvl: 2, open: true, icon: 'kt', html: `${name} <span class="g">${SRC}/${dir}</span>` }, { lvl: 3, icon: 'warn', html: `${msg} <span class="g">:${l}</span>` });
    con.push(`<span class="cw">w: file://${ROOT}/${SRC}/${file}:${l}:${c} ${msg}</span>`);
    kotlin.html = `:app:compileDebugKotlin <span class="g">${warned} warning${warned > 1 ? 's' : ''}</span>`;
    renderTree();
  };
  warn();
  const status = html => { $('status').innerHTML = html; };
  status('Gradle Build Running<div class="bar"></div>');
  renderTree();
  setTimeout(warn, 9000);

  const finish = ok => {
    document.body.classList.remove('running');
    const ms = elapsed(), s = Math.round(ms / 1000), gr = `${Math.floor(s / 60)}m ${s % 60}s`;
    rootNode.icon = ok ? 'ok' : 'err';
    rootNode.html = `<b>Build Pantry:</b> <span class="g">${ok ? 'finished' : 'failed'} At ${at()}</span>`;
    rootNode.d = dur(ms);
    status(`Gradle build ${ok ? 'finished' : 'failed'} in ${Math.floor(s / 60)} m ${s % 60} s ${ms % 1000} ms`);
    return gr;
  };

  demo.onStart = durationMs => {
    const t0 = Date.now(), ok = demo.outcome === 'success';
    setTimeout(warn, durationMs * 0.2);
    if (ok) {
      const REST = [[':app:compileDebugJavaWithJavac', 'NO-SOURCE'], [':app:hiltAggregateDepsDebug', '', '1 sec, 82 ms'], [':app:hiltJavaCompileDebug', '', '6 sec, 310 ms'],
        [':app:transformDebugClassesWithAsm', '', '2 sec, 47 ms'], [':app:dexBuilderDebug', '', '9 sec, 512 ms'], [':app:mergeDebugGlobalSynthetics', '', '214 ms'],
        [':app:mergeProjectDexDebug', '', '3 sec, 188 ms'], [':app:mergeDebugJavaResource', '', '1 sec, 340 ms'], [':app:mergeDebugJniLibFolders', 'UP-TO-DATE', '1 ms'],
        [':app:validateSigningDebug', 'UP-TO-DATE', '1 ms'], [':app:writeDebugAppMetadata', 'UP-TO-DATE', '1 ms'], [':app:packageDebug', '', '4 sec, 66 ms'],
        [':app:createDebugApkListingFileRedirect', '', '3 ms'], [':app:assembleDebug', '', '']];
      setTimeout(() => {
        kotlin.icon = 'ok'; kotlin.d = dur(elapsed() - 39000); kotlin.open = false;
        // Collapse the warnings under the finished task, as the tree does.
        for (let k = tree.length - 1; tree[k] !== kotlin; k--) if (tree[k].lvl > 1) tree.splice(k, 1);
        renderTree();
        REST.forEach(([n, s, d], k) => setTimeout(() => {
          task(n, s, d);
          if (k === REST.length - 1) {
            const gr = finish(true);
            con.push('', `BUILD SUCCESSFUL in ${gr}`, '47 actionable tasks: 26 executed, 21 up-to-date', '', '<a>Build Analyzer</a> results available');
            renderTree(); demo.trigger();
          } else renderTree();
        }, (durationMs * 0.45) * (k + 1) / REST.length - 50));
      }, durationMs * 0.55);
    } else {
      setTimeout(() => {
        kotlin.icon = 'err'; kotlin.d = dur(elapsed() - 39000);
        kotlin.html = `:app:compileDebugKotlin <span class="g">2 errors ${warned} warnings</span>`;
        const file = `${SRC}/data/PantryRepository.kt`;
        tree.push({ lvl: 2, open: true, icon: 'kt', html: `PantryRepository.kt <span class="g">${SRC}/data</span>` },
          { lvl: 3, icon: 'err', cls: 'sel', html: `Unresolved reference 'expiresAt'. <span class="g">:57</span>` },
          { lvl: 3, icon: 'err', html: `Argument type mismatch: actual type is 'Long?', but 'Long' was expected. <span class="g">:66</span>` },
          { lvl: 1, icon: 'err', html: 'org.gradle.api.GradleException: Compilation error. See log for more details' });
        const gr = finish(false);
        con.push(`<span class="ce">e: file://${ROOT}/${file}:57:26 Unresolved reference 'expiresAt'.</span>`,
          `<span class="ce">e: file://${ROOT}/${file}:66:30 Argument type mismatch: actual type is 'Long?', but 'Long' was expected.</span>`, '',
          '&gt; Task :app:compileDebugKotlin FAILED', '', 'FAILURE: Build failed with an exception.', '', '* What went wrong:',
          "Execution failed for task ':app:compileDebugKotlin'.",
          '&gt; A failure occurred while executing org.jetbrains.kotlin.compilerRunner.GradleCompilerRunnerWithWorkers$GradleKotlinCompilerWorkAction',
          '   &gt; Compilation error. See log for more details', '', '* Try:', '&gt; Run with --info or --debug option to get more log output.',
          '&gt; Run with --scan to get full insights.', '&gt; Get more help at <a>https://help.gradle.org</a>.', '', `BUILD FAILED in ${gr}`,
          '21 actionable tasks: 20 executed, 1 up-to-date');
        document.body.classList.add('failed');
        renderCode(true); renderTree(); demo.trigger();
      }, durationMs);
    }
  };
</script>
