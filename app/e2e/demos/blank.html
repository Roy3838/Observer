<!DOCTYPE html>
<!-- A browser's empty new tab, for the scenarios where the right answer is to build nothing: if the
     MCP shares the screen anyway, the picker finds this tab instead of hanging. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<link rel="stylesheet" href="fonts/google-sans.css">
<style>
  body { margin: 0; height: 100vh; background: #fff; font-family: 'Google Sans', Roboto, sans-serif; display: grid; place-items: center; }
  .box { width: 584px; height: 46px; border-radius: 24px; border: 1px solid #dfe1e5; box-shadow: 0 1px 6px rgba(32,33,36,.18); display: flex; align-items: center; padding: 0 20px; color: #70757a; margin-top: -120px; }
</style>
<script src="demo-contract.js"></script>
</head>
<body><div class="box">Search Google or type a URL</div></body>
</html>
